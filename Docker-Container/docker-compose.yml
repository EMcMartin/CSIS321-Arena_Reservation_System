services:
  api:   # listen on port 8887
    build:
      context: .
      dockerfile: ./dockerfile
    ports:
      - "8887:8887"
    env_file:
      - .env
    volumes:
      - ./src:/api #map src directory for autoreload
    restart: no
    networks:
      - api-net


networks:
  api-net:
    name: api-net
