<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arena Reservation</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="icon" href="{{ url_for('static', filename='images/gf_blue_slate.png') }}">
    </head>

    <body>
       
        <div id="container">
            <div id="header">
                <img src="{{ url_for('static', filename='images/Logo.png') }}" height="100">
                <div>Event Calendar</div>
                <div>
                    <button id="loginButton">Login</button>
                </div>
            </div>
            
            

            <div id="header">
                <div id="monthDisplay"></div>
                <div>
                    <button id="backButton">Back</button>
                    <button id="nextButton">Next</button>
                </div>
            </div>

            <div id="weekdays">
                <div>Sunday</div>
                <div>Monday</div>
                <div>Tuesday</div>
                <div>Wednesday</div>
                <div>Thursday</div>
                <div>Friday</div>
                <div>Saturday</div>
            </div>


            <div id="calendar"></div>
        </div>
       
        


        <div class="modal" id="newEventModal">
            <h2>New Event</h2>
            <input type="text" id="eventTitleInput" placeholder="Event Title" required>
            <div class="time-pair">
                <div class="time-wrapper">
                    <label for="start-time"> Start Time</label>
                    <input type="time" id="start-time" name="start-time" min="09:00" max="18:00" value="12:00" required>
                </div>
                
                <div class="time-wrapper">
                    <label for="end-time"> End Time</label>
                    <input type="time" id="end-time" name="end-time" min="09:00" max="18:00" value="12:00" required>
                </div>
            </div>
            <input type="text" id="nameInput" placeholder="Name">
            <input type="email" id="emailInput" placeholder="Email">
            <textarea id="descriptionTextArea" placeholder="Description"></textarea>

            <button id="saveButton">Save</button>
            <button class="red" id="cancelButton">Cancel</button>
        </div>
    

        <div class="modal" id="deleteEventModal">
            <h2>Event</h2>

            <p id="eventText"></p>

            <button class="red" id="deleteButton">Delete</button>
            <button id="closeButton">Close</button>
        </div>

       

        <div id="modalBackDrop"></div>

        <script src="{{ url_for('static', filename='js/script.js') }}"> </script>
    </body>
</html>
