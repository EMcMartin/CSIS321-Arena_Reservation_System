<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar App Vanilla JS</title>

        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="gf_blue_slate.png">
    </head>

    <body>


       
        <div id="container">
            <div id="header">
                <img src="Logo.png" height="100">
                <div>Event Calendar</div>
                <div>
                    <button id="loginButton">Login</button>
                </div>
            </div>
            
            

            <div id="header">
                <div id="monthDisplay"></div>
                <div>
                    <button id="backButton">Back</button>
                    <button id="nextButton">Next</button>
                </div>
            </div>

            <div id="weekdays">
                <div>Sunday</div>
                <div>Monday</div>
                <div>Tuesday</div>
                <div>Wednesday</div>
                <div>Thursday</div>
                <div>Friday</div>
                <div>Saturday</div>
            </div>


            <div id="calendar"></div>
        </div>
       
        


        <div id="newEventModal">
            <h2>New Event</h2>
            <input id="eventTitleInput" placeholder="Event Title" />
            <br>
            <div id="timeDropdowns">
                <div class = "dropdown">
                    <button>Start Time</button>
                    <div class="content">
                        <a href="#">9:00 AM</a>
                        <a href="#">10:00 AM</a>
                        <a href="#">11:00 AM</a>
                        <a href="#">12:00 PM</a>
                        <a href="#">1:00 PM</a>
                        <a href="#">2:00 PM</a>
                        <a href="#">3:00 PM</a>
                        <a href="#">4:00 PM</a>
                    </div>
                </div>
                <div class = "dropdown">
                    <button>End Time</button>
                    <div class="content">
                        <a href="#">9:00 AM</a>
                        <a href="#">10:00 AM</a>
                        <a href="#">11:00 AM</a>
                        <a href="#">12:00 PM</a>
                        <a href="#">1:00 PM</a>
                        <a href="#">2:00 PM</a>
                        <a href="#">3:00 PM</a>
                        <a href="#">4:00 PM</a>
                    </div>
                </div>
            </div>
            <br>
            <input id="nameInput" placeholder="Name" />
            <br>
            <input id="emailInput" placeholder="Email" />
            <br>
            <textarea id="descriptionTextArea" placeholder="Description"></textarea>

            <!--
            <h2>Choose a Time:</h2>

        
            <button id="timeButton">9:00 AM</button>
            <button id="timeButton">10:00 AM</button>
            <button id="timeButton">11:00 AM</button>
            <button id="timeButton">12:00 PM</button>
            <button id="timeButton">1:00 PM</button>
            <button id="timeButton">2:00 PM</button>
            <button id="timeButton">3:00 PM</button>
            <button id="timeButton">4:00 PM</button>
        -->

            

            <button id="saveButton">Save</button>
            <button id="cancelButton">Cancel</button>
        </div>
    

        <div id="deleteEventModal">
            <h2>Event</h2>

            <p id="eventText"></p>

            <button id="deleteButton">Delete</button>
            <button id="closeButton">Close</button>
        </div>

       

        <div id="modalBackDrop"></div>

        <script src="./script.js"></script>
    </body>
</html>
